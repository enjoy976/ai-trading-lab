<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRYX ZONE GOLD SNIPER — Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="auth-language-bar">
  <div class="language-switcher">
    <button data-language="mn" class="active">MN</button>
    <button data-language="en">EN</button>
  </div>
</div>

<div class="auth-glow-orb"></div>

<div class="login-box" style="position: relative; z-index: 20;">

  <div class="auth-brand">
    <div class="auth-brand__icon"></div>
    <h1>STRYX ZONE</h1>
    <div class="auth-brand__sub">GOLD SNIPER</div>
  </div>

  <div class="auth-divider"></div>

  <h2 data-i18n="auth_login_title">🔐 SYSTEM LOGIN</h2>

  <form class="auth-form" onsubmit="event.preventDefault(); loginUser();">

    <label class="auth-field">
      <span data-i18n="auth_email_label">Email</span>
      <input id="loginEmail" type="email" placeholder="Enter email хаягаа оруулна уу">
    </label>

    <label class="auth-field">
      <span data-i18n="auth_password_label">Нууц үг</span>
      <input id="loginPassword" type="password" placeholder="Нууц үгээ оруулна уу">
    </label>

    <button class="access-btn" type="submit">
      <span data-i18n="auth_login_button">НЭВТРЭХ</span>
    </button>

  </form>

  <p id="loginResult" class="auth-result"></p>

  <div class="auth-links">
    <a href="reset-password.html" style="color: #F0CE6E; font-weight: 600;">🔑 Нууц үгээ мартсан уу?</a>
    <a href="signup.html" data-i18n="auth_signup_link">Шинээр бүртгэл үүсгэх</a>
    <a href="index.html" data-i18n="auth_back_home">← Back Home</a>
  </div>

</div>

<script src="https://jsdelivr.net"></script>
<script src="auth.js"></script>
<script src="language.js"></script>

</body>
</html>
