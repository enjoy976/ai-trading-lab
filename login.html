<!DOCTYPE html>
<html lang="mn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STRYX ZONE GOLD SNIPER — Login</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


<div class="auth-language-bar">

  <div class="language-switcher">

    <button data-language="mn" class="active">MN</button>

    <button data-language="en">EN</button>

  </div>

</div>


<div class="auth-glow-orb"></div>


<div class="login-box">


  <div class="auth-brand">

    <div class="auth-brand__icon"></div>

    <h1>STRYX ZONE</h1>

    <div class="auth-brand__sub">GOLD SNIPER</div>

  </div>


  <div class="auth-divider"></div>


  <h2 data-i18n="auth_login_title">🔐 SYSTEM LOGIN</h2>


  <form class="auth-form" onsubmit="event.preventDefault(); loginUser();">


    <label class="auth-field">

      <span data-i18n="auth_email_label">Email</span>

      <input
      id="loginEmail"
      type="email"
      placeholder="Enter email хаягаа оруулна уу">

    </label>


    <label class="auth-field">

      <span data-i18n="auth_password_label">Нууц үг</span>

      <input
      id="loginPassword"
      type="password"
      placeholder="Нууц үгээ оруулна уу">

    </label>


    <button
    class="access-btn"
    type="submit">

      <span data-i18n="auth_login_button">НЭВТРЭХ</span>

    </button>


  </form>


  <p id="loginResult" class="auth-result"></p>
  
      <div style="text-align: right; margin: 12px 0 8px; position: relative; z-index: 50;">
    <button type="button" onclick="forgotPassword()" style="background: rgba(212,175,55,0.12); border: 1px solid rgba(212,175,55,0.45); color: #F0CE6E; font-size: 13px; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600;">
      🔑 Нууц үгээ мартсан уу?
    </button>
  </div>


  <!-- И-МЭЙЛ ЛИНКЭЭР ОРЖ ИРЭХЭД ГАРАХ ШИНЭ НУУЦ ҮГ ОРУУЛАХ ХЭСЭГ -->
  <div id="resetPasswordBox" style="display: none; margin-top: 16px; padding: 16px; border-radius: 12px; background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.45);">
    <div style="color: #F0CE6E; font-weight: 700; font-size: 14px; margin-bottom: 10px;">🔐 ШИНЭ НУУЦ ҮГ ТОХИРУУЛАХ</div>
    <input id="newPasswordInput" type="password" placeholder="Шинэ нууц үгээ бичнэ үү (6+ тэмдэгт)" style="width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.4); background: #0B0E14; color: #fff; margin-bottom: 10px;">
    <button type="button" onclick="updateNewPassword()" class="access-btn" style="width: 100%;">
      ✅ ШИНЭ НУУЦ ҮГ ХАДГАЛАХ
    </button>
  </div>


  <div class="auth-links">

    <a href="signup.html" data-i18n="auth_signup_link">Шинээр бүртгэл үүсгэх</a>

    <a href="index.html" data-i18n="auth_back_home">← Back Home</a>

  </div>


</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="auth.js"></script>

<script src="language.js"></script>


</body>

</html>
