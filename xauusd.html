<!DOCTYPE html>
<html lang="mn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forex Live Market</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>
🌍 FOREX LIVE MARKET
</h1>


<p class="subtitle">
Real Time Currency Monitor
</p>


<div class="status">

🟢 MARKET DATA ONLINE

</div>




<div class="result">


<h2>
📊 LIVE FOREX PRICES
</h2>


<hr>



<table style="width:100%;">

<thead>

<tr>

<th>PAIR</th>

<th>PRICE</th>

<th>UPDATE</th>

</tr>

</thead>



<tbody id="market">

<tr>

<td colspan="3">
Loading...
</td>

</tr>

</tbody>


</table>



</div>




<br>



<a href="dashboard.html" class="signup-btn">

⬅ BACK DASHBOARD

</a>



</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="auth.js"></script>



<script>


// LOGIN CHECK


async function checkAccess(){


const {data} = await supabaseClient.auth.getSession();


if(!data.session){


window.location.href="login.html";


return;


}


}


checkAccess();






// FOREX DATA FROM YOUR SERVER


async function loadForex(){


try{


const response = await fetch(

"https://disposal-exorcist-silly.ngrok-free.dev/forex?_=" + Date.now(),

{
cache:"no-store"
}

);



const data = await response.json();



let html = "";



for(let pair in data){


html += `

<tr>

<td>

<b>${pair}</b>

</td>


<td>

${data[pair].price}

</td>


<td>

${data[pair].time}

</td>


</tr>

`;



}



document.getElementById("market").innerHTML = html;



}



catch(error){


console.log(error);


document.getElementById("market").innerHTML =

`

<tr>

<td colspan="3">

❌ Server Connection Error

</td>

</tr>

`;



}


}




loadForex();


setInterval(loadForex,10000);



</script>



</body>

</html>
