<!DOCTYPE html>
<html lang="mn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forex Live Market</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>
🌍 FOREX LIVE MARKET
</h1>


<p class="subtitle">
Real Time Currency Monitor
</p>



<div class="status">

🟢 MARKET DATA ONLINE

</div>





<div class="result">


<h2>
📊 LIVE FOREX PRICES
</h2>


<hr>



<div id="market" class="forex-grid">


<div class="forex-card">

Loading...

</div>


</div>



</div>





<br>



<a href="dashboard.html" class="signup-btn">

⬅ BACK DASHBOARD

</a>




</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="auth.js"></script>





<script>


// ===============================
// LOGIN CHECK
// ===============================


async function checkAccess(){


const {data} = await supabaseClient.auth.getSession();



if(!data.session){


window.location.href="login.html";


return;


}


}


checkAccess();








// ===============================
// FOREX API
// ===============================


const pairs = [

"EURUSD",
"GBPUSD",
"USDJPY",
"AUDUSD",
"USDCAD",
"USDCHF",
"NZDUSD",
"EURJPY",
"GBPJPY",
"EURGBP"

];







async function loadForex(){


try{


const response = await fetch(

"https://open.er-api.com/v6/latest/USD"

);



const data = await response.json();



let html = "";



pairs.forEach(pair=>{


let base = pair.substring(0,3);

let quote = pair.substring(3,6);



let price = 0;



if(base==="USD"){


price = data.rates[quote];


}


else if(quote==="USD"){


price = 1 / data.rates[base];


}


else{


price = data.rates[quote] / data.rates[base];


}





let decimals = pair.includes("JPY") ? 3 : 5;




html += `


<div class="forex-card">


<div class="pair">

${pair}

</div>



<div class="price">

${price.toFixed(decimals)}

</div>



<div class="market-live">

🟢 LIVE

</div>



<div class="update">

Last Update:

${new Date().toLocaleTimeString()}

</div>



</div>


`;



});




document.getElementById("market").innerHTML = html;



}



catch(error){


console.log(error);



document.getElementById("market").innerHTML =


`

<div class="forex-card">

❌ API Connection Error

</div>

`;



}



}






loadForex();



setInterval(loadForex,60000);



</script>






</body>

</html>
