<!DOCTYPE html>
<html lang="mn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forex Live Market</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>
🌍 FOREX LIVE MARKET
</h1>


<p class="subtitle">
Real Time Currency Monitor
</p>



<div class="status">

🟢 MARKET DATA ONLINE

</div>





<div class="result">


<h2>
📊 LIVE FOREX PRICES
</h2>


<hr>



<table style="width:100%;">

<thead>

<tr>

<th>PAIR</th>

<th>PRICE</th>

<th>UPDATE</th>

</tr>

</thead>


<tbody id="market">


<tr>

<td colspan="3">

Loading...

</td>

</tr>


</tbody>


</table>


</div>





<br>



<a href="dashboard.html" class="signup-btn">

⬅ BACK DASHBOARD

</a>




</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="auth.js"></script>





<script>


// ===============================
// LOGIN CHECK
// ===============================


async function checkAccess(){


const {data} = await supabaseClient.auth.getSession();



if(!data.session){


window.location.href="login.html";


return;


}


}



checkAccess();







// ===============================
// FOREX MARKET DATA
// ===============================


const pairs = [

"EURUSD",
"GBPUSD",
"USDJPY",
"AUDUSD",
"USDCAD",
"USDCHF",
"NZDUSD",
"EURGBP",
"EURJPY",
"GBPJPY"

];






async function loadForex(){


try{


const response = await fetch(

"https://api.frankfurter.app/latest?from=USD"

);



const data = await response.json();



let html = "";




pairs.forEach(pair=>{


let base = pair.substring(0,3);

let quote = pair.substring(3,6);



let price = null;



// USD to other currency

if(base === "USD"){


if(data.rates[quote]){


price = data.rates[quote];


}



}



// other currency to USD

else if(quote === "USD"){



if(data.rates[base]){


price = 1 / data.rates[base];


}



}



// Cross currency

else{


if(data.rates[base] && data.rates[quote]){


price = data.rates[quote] / data.rates[base];


}



}




if(price !== null){



let decimals = 5;



if(pair.includes("JPY")){

decimals = 3;

}



html += `


<tr>


<td>

<b>${pair}</b>

</td>


<td>

${price.toFixed(decimals)}

</td>


<td>

${new Date().toLocaleTimeString()}

</td>


</tr>


`;



}



});






document.getElementById("market").innerHTML = html;



}



catch(error){


console.log(error);



document.getElementById("market").innerHTML =


`

<tr>

<td colspan="3">

❌ Connection Error

</td>

</tr>

`;



}



}





loadForex();



setInterval(loadForex,60000);




</script>



</body>

</html>
