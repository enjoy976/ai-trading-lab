<!DOCTYPE html>
<html lang="mn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STRYX ZONE GOLD SNIPER — Signup</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


<div class="auth-language-bar">

  <div class="language-switcher">

    <button data-language="mn" class="active">MN</button>

    <button data-language="en">EN</button>

  </div>

</div>


<div class="auth-glow-orb"></div>


<div class="login-box">


  <div class="auth-brand">

    <div class="auth-brand__icon"></div>

    <h1>STRYX ZONE</h1>

    <div class="auth-brand__sub">GOLD SNIPER</div>

  </div>


  <div class="auth-divider"></div>


  <h2 data-i18n="auth_signup_title">🧬 БҮРТГҮҮЛЭХ</h2>


  <form class="auth-form" onsubmit="event.preventDefault(); signupUser();">


    <label class="auth-field">

      <span data-i18n="auth_email_label">Email</span>

      <input
      id="signupEmail"
      type="email"
      placeholder="Enter email хаягаа оруулна уу">

    </label>


    <label class="auth-field">

      <span data-i18n="auth_password_label">Нууц үг</span>

      <input
      id="signupPassword"
      type="password"
      placeholder="Шинэ нууц үгээ оруулна уу">

    </label>


    <button
    class="access-btn"
    type="submit">

      <span data-i18n="auth_signup_button">ШИНЭ ХАЯГ ҮҮСГЭХ</span>

    </button>


  </form>


  <p id="signupResult" class="auth-result"></p>


  <div class="auth-links">

    <a href="login.html" data-i18n="auth_have_account">Аль хэдийн бүртгэлтэй юу?</a>

    <a href="index.html" data-i18n="auth_back_home_mn">← Нүүр хуудас руу буцах</a>

  </div>


</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="auth.js"></script>

<script src="language.js"></script>


</body>

</html>
