<!DOCTYPE html>
<html lang="mn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 STRYX AI MENTOR &amp; SMC COACH</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --obsidian:       #0B0E14;
  --obsidian-2:     #11151F;
  --obsidian-3:     #161B27;
  --surface:        rgba(22, 27, 39, 0.72);
  --surface-2:      rgba(17, 21, 31, 0.85);
  --border:         rgba(212, 175, 55, 0.14);
  --border-strong:  rgba(212, 175, 55, 0.30);
  --gold:           #D4AF37;
  --gold-bright:    #F0CE6E;
  --gold-dim:       #8E7423;
  --gold-glow:      rgba(212, 175, 55, 0.18);
  --text:           #E8ECF2;
  --text-muted:     #8A93A6;
  --text-dim:       #5C6478;
  --green:          #22C55E;
  --green-glow:     rgba(34, 197, 94, 0.15);
  --red:            #EF4444;
  --red-glow:       rgba(239, 68, 68, 0.15);
  --radius:         16px;
  --radius-sm:      10px;
  --mono:           'JetBrains Mono', 'Courier New', monospace;
  --sans:           'Inter', 'Segoe UI', Arial, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--obsidian);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212,175,55,0.06), transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 100%, rgba(212,175,55,0.04), transparent 60%);
  z-index: -2;
  pointer-events: none;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(212,175,55,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,175,55,0.025) 1px, transparent 1px);
  background-size: 48px 48px;
  z-index: -1;
  pointer-events: none;
  mask-image: radial-gradient(ellipse 100% 70% at 50% 30%, black, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 100% 70% at 50% 30%, black, transparent 80%);
}

/* ===== HEADER ===== */
.mentor-header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 24px;
  background: rgba(11, 14, 20, 0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  color: var(--gold);
  font-size: 13px;
  font-weight: 600;
  font-family: var(--mono);
  letter-spacing: 1px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--gold-glow);
  transition: all 0.25s ease;
  flex-shrink: 0;
}

.back-link:hover {
  color: var(--gold-bright);
  border-color: var(--gold);
  box-shadow: 0 0 20px var(--gold-glow);
  transform: translateX(-3px);
}

.mentor-header__title {
  font-size: 17px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 0.5px;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.price-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  border-radius: 30px;
  background: var(--obsidian-2);
  border: 1px solid var(--border-strong);
  flex-shrink: 0;
  transition: all 0.3s ease;
}

.price-badge__icon {
  font-size: 14px;
}

.price-badge__label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 1px;
}

.price-badge__value {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  color: var(--gold-bright);
  text-shadow: 0 0 10px var(--gold-glow);
  letter-spacing: 0.5px;
}

.price-badge.loading .price-badge__value {
  color: var(--text-dim);
  text-shadow: none;
}

/* ===== CHAT LAYOUT ===== */
.chat-wrapper {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  height: calc(100vh - 62px);
  padding: 0 16px;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 0 12px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ===== MESSAGE BUBBLES ===== */
.msg {
  max-width: 82%;
  padding: 16px 20px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.65;
  animation: msg-in 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  position: relative;
}

@keyframes msg-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg--bot {
  align-self: flex-start;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  color: var(--text);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.msg--bot::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: linear-gradient(180deg, var(--gold), var(--gold-dim));
  border-radius: 18px 0 0 18px;
}

.msg--user {
  align-self: flex-end;
  background: linear-gradient(135deg, rgba(212,175,55,0.12), rgba(212,175,55,0.05));
  border: 1px solid var(--border-strong);
  border-bottom-right-radius: 4px;
  color: var(--text);
}

.msg__author {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.msg--bot .msg__author { color: var(--gold); }
.msg--user .msg__author { color: var(--text-muted); text-align: right; }

.msg__body {
  white-space: pre-wrap;
  word-break: break-word;
}

.msg__body b {
  color: var(--gold-bright);
}

.msg__body .highlight {
  color: var(--green);
  font-weight: 600;
}

.msg__body .warn {
  color: var(--red);
  font-weight: 600;
}

/* ===== TYPING INDICATOR ===== */
.typing {
  align-self: flex-start;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  border-radius: 18px;
  padding: 18px 20px;
  display: none;
  position: relative;
}

.typing.show { display: flex; gap: 5px; }

.typing::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: linear-gradient(180deg, var(--gold), var(--gold-dim));
  border-radius: 18px 0 0 18px;
}

.typing__dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0.4;
  animation: typing-bounce 1.2s ease-in-out infinite;
}

.typing__dot:nth-child(2) { animation-delay: 0.15s; }
.typing__dot:nth-child(3) { animation-delay: 0.3s; }

@keyframes typing-bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* ===== SUGGESTION CHIPS ===== */
.suggestion-chips {
  display: flex;
  gap: 8px;
  padding: 10px 0;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  flex-shrink: 0;
}

.suggestion-chips::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 10px 16px;
  border-radius: 30px;
  font-size: 13px;
  font-family: var(--sans);
  font-weight: 500;
  cursor: pointer;
  transition: all 0.25s ease;
  white-space: nowrap;
  letter-spacing: 0.3px;
}

.chip:hover {
  border-color: var(--gold);
  color: var(--gold-bright);
  background: var(--gold-glow);
  box-shadow: 0 0 16px var(--gold-glow);
}

/* ===== INPUT BAR ===== */
.input-bar {
  display: flex;
  gap: 10px;
  padding: 12px 0 20px;
  flex-shrink: 0;
}

.input-bar__field {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 14px 22px;
  color: var(--text);
  font-size: 14px;
  font-family: var(--sans);
  outline: none;
  transition: all 0.25s ease;
}

.input-bar__field::placeholder {
  color: var(--text-dim);
}

.input-bar__field:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--gold-glow);
}

.input-bar__send {
  background: linear-gradient(135deg, var(--gold), var(--gold-dim));
  color: var(--obsidian);
  border: none;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.25s ease;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

.input-bar__send:hover {
  background: linear-gradient(135deg, var(--gold-bright), var(--gold));
  box-shadow: 0 0 20px var(--gold-glow);
  transform: scale(1.05);
}

.input-bar__send:active {
  transform: scale(0.95);
}

/* ===== SCROLLBAR ===== */
.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }
.chat-messages::-webkit-scrollbar-thumb:hover { background: var(--gold); }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--obsidian); }
::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }
::selection { background: var(--gold-glow); color: var(--gold-bright); }

/* ===== RESPONSIVE ===== */
@media (max-width: 640px) {
  .mentor-header {
    padding: 12px 14px;
    gap: 8px;
  }

  .back-link {
    padding: 7px 12px;
    font-size: 12px;
  }

  .mentor-header__title {
    font-size: 14px;
  }

  .price-badge {
    padding: 6px 12px;
  }

  .price-badge__value {
    font-size: 13px;
  }

  .chat-wrapper {
    padding: 0 10px;
    height: calc(100vh - 56px);
  }

  .msg {
    max-width: 92%;
    font-size: 13px;
    padding: 14px 16px;
  }

  .chip {
    font-size: 12px;
    padding: 8px 14px;
  }

  .input-bar__field {
    font-size: 13px;
    padding: 12px 18px;
  }

  .input-bar__send {
    width: 44px;
    height: 44px;
    font-size: 16px;
  }
}
</style>

</head>

<body>

<!-- ===== HEADER ===== -->
<div class="mentor-header">
  <a href="dashboard.html" class="back-link">← DASHBOARD</a>
  <div class="mentor-header__title">🧠 STRYX AI MENTOR &amp; SMC COACH</div>
  <div class="price-badge loading" id="priceBadge">
    <span class="price-badge__icon">🥇</span>
    <div>
      <div class="price-badge__label">XAUUSD</div>
      <div class="price-badge__value" id="xauPrice">...</div>
    </div>
  </div>
</div>

<!-- ===== CHAT ===== -->
<div class="chat-wrapper">

  <div class="chat-messages" id="chatMessages">
    <!-- Messages injected by JS -->
  </div>

  <div class="typing" id="typingIndicator">
    <div class="typing__dot"></div>
    <div class="typing__dot"></div>
    <div class="typing__dot"></div>
  </div>

  <div class="suggestion-chips" id="suggestionChips">
    <button class="chip" data-q="🥇 Одоо XAUUSD дээр юу анхаарах вэ?">🥇 Одоо XAUUSD дээр юу анхаарах вэ?</button>
    <button class="chip" data-q="😰 2 дараалан SL цохиуллаа, яах вэ?">😰 2 дараалан SL цохиуллаа, яах вэ?</button>
    <button class="chip" data-q="📦 Valid Order Block яаж таних вэ?">📦 Valid Order Block яаж таних вэ?</button>
    <button class="chip" data-q="⏰ Killzone цаг хэдээс эхлэх вэ?">⏰ Killzone цаг хэдээс эхлэх вэ?</button>
    <button class="chip" data-q="💰 $500 дансанд хэдэн Lot орох вэ?">💰 $500 дансанд хэдэн Lot орох вэ?</button>
  </div>

  <div class="input-bar">
    <input
      type="text"
      class="input-bar__field"
      id="chatInput"
      placeholder="STRYX AI Mentor-т асуултаа бичнэ үү..."
      autocomplete="off">
    <button class="input-bar__send" id="sendBtn">➤</button>
  </div>

</div>

<script>
(function() {
  let liveGold = 3646.60;

  async function syncGoldPrice() {
    try {
      const url = "https://" + "api." + "gold-api.com" + "/price/XAU";
      const res = await fetch(url);
      const data = await res.json();
      if (data && data.price && !isNaN(data.price)) {
        liveGold = Number(data.price);
        document.querySelectorAll("span, div, b").forEach(el => {
          if (el.children.length === 0 && (el.textContent.includes("Loading") || el.textContent.includes("XAUUSD:"))) {
            el.textContent = "🥇 XAUUSD: $" + liveGold.toFixed(2);
          }
        });
      }
    } catch (e) {}
  }
  syncGoldPrice();
  setInterval(syncGoldPrice, 15000);

  const input = document.querySelector("input[type='text'], textarea");
  const sendBtn = document.querySelector("button[type='submit'], #sendBtn, .send-btn") || Array.from(document.querySelectorAll("button")).pop();
  const chatBox = document.querySelector(".chat-messages, .messages, #chatMessages, #messages") || input?.parentElement?.previousElementSibling;

  if (!input || !chatBox) return;

  function appendBubble(text, isUser) {
    const wrap = document.createElement("div");
    wrap.style.cssText = isUser
      ? "align-self:flex-end; background:linear-gradient(135deg,#F0CE6E,#D4AF37); color:#0B0E14; padding:12px 16px; border-radius:14px 14px 2px 14px; max-width:80%; margin:8px 0; font-size:14px; font-weight:600; margin-left:auto;"
      : "align-self:flex-start; background:rgba(22,27,39,0.92); border:1px solid rgba(212,175,55,0.4); color:#E8ECF2; padding:14px 18px; border-radius:14px 14px 14px 2px; max-width:85%; margin:8px 0; font-size:14px; line-height:1.65; white-space:pre-line;";
    wrap.innerHTML = isUser ? text : `<div style="font-size:11px; color:#F0CE6E; font-weight:700; margin-bottom:5px;">🧠 STRYX AI MENTOR</div>${text}`;
    chatBox.appendChild(wrap);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function fallbackReply(q) {
    const s = q.toLowerCase();
    if (s.includes("fvg") || s.includes("fair value") || s.includes("imbalance")) {
      return `⚡ **FVG (Fair Value Gap):** 3 дараалсан лааны 1 ба 3-р лааны сүүдэр шүргэлцэлгүй үлдсэн хоосон зай. Зах зээл тэр зайг нөхөхөөр буцаж ирдэг.`;
    }
    if (s.includes("order block") || s.includes("ob")) {
      return `📦 **Valid Order Block:** Өмнөх High/Low-ийн Liquidity-г түүж, хүчтэй импульс лаагаар BOS хийсэн цэгийн сүүлийн эсрэг өнгийн лаа.`;
    }
    if (s.includes("sl") || s.includes("алда") || s.includes("шунал") || s.includes("сэтгэл")) {
      return `🛡️ **Сэтгэл зүйн дүрэм:** 2 дараалан SL цохиулбал дэлгэцээ хааж амар. Уураар арилжаанд орох нь данс шатаах гол шалтгаан болдог.`;
    }
    if (s.includes("killzone") || s.includes("цаг")) {
      return `⏰ **УБ-ын цагаар Killzone:** Лондон **16:00–18:00**, Нью-Йорк **21:00–23:00** цагт оргил хөдөлгөөн гарна.`;
    }
    if (s.includes("lot") || s.includes("эрсдэл") || s.includes("данс")) {
      return `💰 **Эрсдэлийн дүрэм:** Нэг арилжаанд дансны **1%-иас илүү** эрсдэл бүү гарга ($500 дансанд 0.01–0.02 Lot).`;
    }
    return `🥇 **STRYX AI MENTOR (XAUUSD: $${liveGold.toFixed(2)}):**\n\nЗах зээл дээр эхлээд H1 чиглэлээ тодорхойлоод, Liquidity Sweep + Fresh Order Block баталгаажуулалт хүлээгээрэй!`;
  }

  async function askUnlimitedFreeAI(userQuestion) {
    try {
      const sysPrompt = `ЧИНИЙ НЭР БОЛ ЗӨВХӨН "STRYX AI MENTOR". Хэзээ ч өөрийгөө ChatGPT эсвэл OpenAI гэж битгий хэл! Чи бол Монголын хамгийн шилдэг арилжааны платформ болох STRYX ZONE GOLD SNIPER (goldsniper.xyz)-ийн албан ёсны хиймэл оюун ухаант арилжааны багш юм. Одоогийн XAUUSD (Алт) бодит ханш $${liveGold.toFixed(2)} байна. Хэрэглэгчийн асуултад зөвхөн цэвэр МОНГОЛ хэлээр, SMC ба эрсдэлийн удирдлагын үүднээс товч, ойлгомжтой зөвлөгөө өг.`;
      const host = "https://" + "text." + "pollinations.ai" + "/";
      const fullUrl = host + encodeURIComponent(sysPrompt + "\n\nАсуулт: " + userQuestion);

      const res = await fetch(fullUrl);
      if (res.ok) {
        const aiText = await res.text();
        if (aiText && aiText.trim().length > 5) return aiText.trim();
      }
    } catch (e) {}
    return fallbackReply(userQuestion);
  }

  async function handleSend(customText) {
    const q = (customText || input.value).trim();
    if (!q) return;
    if (!customText) input.value = "";
    appendBubble(q, true);

    const thinkingEl = document.createElement("div");
    thinkingEl.style.cssText = "align-self:flex-start; background:rgba(22,27,39,0.7); border:1px dashed rgba(212,175,55,0.4); color:#F0CE6E; padding:10px 16px; border-radius:14px; margin:8px 0; font-size:13px; font-family:monospace;";
    thinkingEl.textContent = "🧠 STRYX AI бодож байна...";
    chatBox.appendChild(thinkingEl);
    chatBox.scrollTop = chatBox.scrollHeight;

    const reply = await askUnlimitedFreeAI(q);
    thinkingEl.remove();
    appendBubble(reply, false);
  }

  if (sendBtn) sendBtn.addEventListener("click", (e) => { e.preventDefault(); handleSend(); });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); handleSend(); } });

  document.querySelectorAll("[data-q], .chip, .suggestion").forEach(chip => {
    chip.addEventListener("click", () => handleSend(chip.dataset.q || chip.textContent));
  });
})();
</script>

</body>
</html>
