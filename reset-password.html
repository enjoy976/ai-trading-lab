<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRYX ZONE — Нууц Үг Сэргээх</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="login-box" style="position: relative; z-index: 30; max-width: 420px;">
  <div class="auth-brand">
    <h1>STRYX ZONE</h1>
    <div class="auth-brand__sub">PASSWORD RECOVERY</div>
  </div>
  <div class="auth-divider"></div>

  <div id="step1">
    <h2 style="font-size: 18px; margin-bottom: 12px;">🔑 НУУЦ ҮГ СЭРГЭЭХ</h2>
    <p style="color: #8A93A6; font-size: 13px; margin-bottom: 14px;">
      Бүртгэлтэй Email хаягаа оруулна уу. Бид таны и-мэйл рүү нууц үг сэргээх линк илгээнэ.
    </p>
    <input id="recEmail" type="email" placeholder="Email хаягаа бичнэ үү" style="width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(212,175,55,0.45); background:#0B0E14; color:#fff; margin-bottom:12px;">
    <button id="sendBtn" type="button" onclick="sendRecoveryLink()" class="access-btn" style="width:100%; cursor:pointer;">
      📨 СЭРГЭЭХ ЛИНК ИЛГЭЭХ
    </button>
  </div>

  <div id="step2" style="display:none;">
    <h2 style="font-size: 18px; color:#22C55E; margin-bottom: 12px;">🔐 ШИНЭ НУУЦ ҮГ ОРУУЛАХ</h2>
    <input id="newPass" type="password" placeholder="Шинэ нууц үг (6+ тэмдэгт)" style="width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(34,197,94,0.45); background:#0B0E14; color:#fff; margin-bottom:12px;">
    <button id="updateBtn" type="button" onclick="saveNewPassword()" class="access-btn" style="width:100%; cursor:pointer;">
      ✅ ШИНЭ НУУЦ ҮГ ХАДГАЛАХ
    </button>
  </div>

  <p id="msgBox" class="auth-result" style="margin-top:14px; min-height:24px; font-weight:600;"></p>

  <div class="auth-links" style="margin-top:18px;">
    <a href="login.html">← Нэвтрэх хуудас руу буцах</a>
  </div>
</div>

<script>
const SB_URL = "https://" + "xkxcprkzubjwfglcrivg.supabase.co";
const SB_KEY = "sb_publishable_7rRB4Trj5OfjENqzvpu_YQ_otz11jrh";
const msgBox = document.getElementById("msgBox");

async function sendRecoveryLink() {
  const email = document.getElementById("recEmail").value.trim();
  if (!email || !email.includes("@")) {
    msgBox.style.color = "#F0CE6E";
    msgBox.innerHTML = "⚠️ Зөв Email хаяг оруулна уу.";
    return;
  }

  msgBox.style.color = "#F0CE6E";
  msgBox.innerHTML = "⏳ Сэргээх линк илгээж байна...";

  try {
        const targetUrl = encodeURIComponent(window.location.origin + "/reset-password.html");
    const res = await fetch(SB_URL + "/auth/v1/recover?redirect_to=" + targetUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SB_KEY
      },
      body: JSON.stringify({
        email: email,
        redirect_to: window.location.origin + "/reset-password.html"
      })
    });

    const data = await res.json();
    if (!res.ok) {
      msgBox.style.color = "#EF4444";
      msgBox.innerHTML = "❌ Алдаа: " + (data.msg || data.message || "Илгээж чадсангүй");
    } else {
      msgBox.style.color = "#22C55E";
      msgBox.innerHTML = "🟢 <b>" + email + "</b> хаяг руу линк илгээгдлээ! И-мэйлээ (болон Spam хавтсаа) шалгана уу.";
    }
  } catch (err) {
    msgBox.style.color = "#EF4444";
    msgBox.innerHTML = "❌ Сүлжээний алдаа гарлаа: " + err.message;
  }
}

// Хэрэглэгч и-мэйл дээрх сэргээх линкээр орж ирэхэд URL дээрх access_token-ийг шалгана
window.addEventListener("load", function() {
  const hash = window.location.hash;
  if (hash && hash.includes("access_token=")) {
    document.getElementById("step1").style.display = "none";
    document.getElementById("step2").style.display = "block";
    msgBox.style.color = "#22C55E";
    msgBox.innerHTML = "✅ Баталгаажлаа! Доор шинэ нууц үгээ оруулна уу.";
  }
});

async function saveNewPassword() {
  const pw = document.getElementById("newPass").value;
  if (!pw || pw.length < 6) {
    msgBox.style.color = "#F0CE6E";
    msgBox.innerHTML = "⚠️ Шинэ нууц үг 6-аас дээш тэмдэгттэй байх ёстой.";
    return;
  }

  const params = new URLSearchParams(window.location.hash.substring(1));
  const accessToken = params.get("access_token");

  if (!accessToken) {
    msgBox.style.color = "#EF4444";
    msgBox.innerHTML = "❌ И-мэйл дээрх линкний хугацаа дууссан байна. Дахин линк авна уу.";
    return;
  }

  msgBox.style.color = "#F0CE6E";
  msgBox.innerHTML = "⏳ Шинэ нууц үгийг хадгалж байна...";

  try {
    const res = await fetch(SB_URL + "/auth/v1/user", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "apikey": SB_KEY,
        "Authorization": "Bearer " + accessToken
      },
      body: JSON.stringify({ password: pw })
    });

    if (!res.ok) {
      const errData = await res.json();
      msgBox.style.color = "#EF4444";
      msgBox.innerHTML = "❌ Алдаа: " + (errData.msg || errData.message);
    } else {
      msgBox.style.color = "#22C55E";
      msgBox.innerHTML = "🟢 <b>Нууц үг амжилттай солигдлоо!</b> Нэвтрэх хуудас руу шилжиж байна...";
      setTimeout(() => { window.location.href = "login.html"; }, 1500);
    }
  } catch (err) {
    msgBox.style.color = "#EF4444";
    msgBox.innerHTML = "❌ Алдаа: " + err.message;
  }
}
</script>
</body>
</html>
