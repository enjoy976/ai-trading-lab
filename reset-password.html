<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRYX ZONE — Нууц Үг Сэргээх</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="login-box" style="position: relative; z-index: 30; max-width: 420px;">
  <div class="auth-brand">
    <h1>STRYX ZONE</h1>
    <div class="auth-brand__sub">PASSWORD RECOVERY</div>
  </div>
  <div class="auth-divider"></div>

  <div id="step1">
    <h2 style="font-size: 18px; margin-bottom: 12px;">🔑 НУУЦ ҮГ СЭРГЭЭХ</h2>
    <p style="color: #8A93A6; font-size: 13px; margin-bottom: 14px;">
      Бүртгэлтэй Email хаягаа оруулна уу. Бид таны и-мэйл рүү нууц үг сэргээх линк илгээнэ.
    </p>
    <input id="recEmail" type="email" placeholder="Email хаягаа бичнэ үү" style="width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(212,175,55,0.45); background:#0B0E14; color:#fff; margin-bottom:12px;">
    <button id="sendBtn" type="button" class="access-btn" style="width:100%;">📨 СЭРГЭЭХ ЛИНК ИЛГЭЭХ</button>
  </div>

  <div id="step2" style="display:none;">
    <h2 style="font-size: 18px; color:#22C55E; margin-bottom: 12px;">🔐 ШИНЭ НУУЦ ҮГ ОРУУЛАХ</h2>
    <input id="newPass" type="password" placeholder="Шинэ нууц үг (6+ тэмдэгт)" style="width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(34,197,94,0.45); background:#0B0E14; color:#fff; margin-bottom:12px;">
    <button id="updateBtn" type="button" class="access-btn" style="width:100%;">✅ ШИНЭ НУУЦ ҮГ ХАДГАЛАХ</button>
  </div>

  <p id="msgBox" class="auth-result" style="margin-top:14px;"></p>

  <div class="auth-links" style="margin-top:18px;">
    <a href="login.html">← Нэвтрэх хуудас руу буцах</a>
  </div>
</div>

<script src="https://jsdelivr.net"></script>
<script>
const sb = window.supabase.createClient("https://supabase.co", "sb_publishable_7rRB4Trj5OfjENqzvpu_YQ_otz11jrh");
const msgBox = document.getElementById("msgBox");

document.getElementById("sendBtn").onclick = async () => {
  const email = document.getElementById("recEmail").value.trim();
  if (!email) { msgBox.innerHTML = "⚠️ Email хаягаа бичнэ үү."; return; }
  msgBox.innerHTML = "⏳ Илгээж байна...";
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + "/reset-password.html"
  });
  msgBox.innerHTML = error
    ? "❌ Алдаа: " + error.message
    : "🟢 <b>" + email + "</b> хаяг руу линк илгээгдлээ! И-мэйлээ шалгана уу.";
};

sb.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    document.getElementById("step1").style.display = "none";
    document.getElementById("step2").style.display = "block";
    msgBox.innerHTML = "";
  }
});

document.getElementById("updateBtn").onclick = async () => {
  const pw = document.getElementById("newPass").value;
  if (!pw || pw.length < 6) { msgBox.innerHTML = "⚠️ 6-аас дээш тэмдэгт оруулна уу."; return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) {
    msgBox.innerHTML = "❌ Алдаа: " + error.message;
  } else {
    msgBox.innerHTML = "🟢 <b>Нууц үг солигдлоо!</b> Dashboard руу орж байна...";
    setTimeout(() => location.href = "dashboard.html", 1200);
  }
};
</script>
</body>
</html>
