<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Scanner | STRYX ZONE</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .crypto-wrap { max-width: 1100px; margin: 90px auto 50px; padding: 0 18px; }
    .crypto-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin: 24px 0; }
    .coin-card { background: rgba(16, 20, 29, 0.92); border: 1px solid var(--border-strong); border-radius: 16px; padding: 14px; overflow: hidden; transition: all 0.25s ease; }
    .coin-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.18); border-color: var(--gold); }
    .coin-title { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--gold-bright); margin-bottom: 8px; display: flex; justify-content: space-between; }
    .status-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; background: rgba(16,20,29,0.85); border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px; margin-bottom: 24px; font-family: var(--mono); font-size: 13px; }
  </style>
</head>
<body>

<div class="header-bar" style="top: 0;">
  <a href="dashboard.html" style="text-decoration:none; color:var(--gold-bright); font-family:var(--mono); font-weight:700; font-size:13px;">← DASHBOARD</a>
  <div style="font-family:var(--mono); color:#22C55E; font-size:12px; font-weight:700;">🟢 CRYPTO ENGINE LIVE</div>
</div>

<div class="crypto-wrap">
  <div class="terminal-title" style="margin-bottom: 10px;">
    <h1>₿ STRYX CRYPTO TERMINAL</h1>
    <p class="subtitle">BTC • ETH • SOL Real-Time Market Intelligence</p>
  </div>

  <!-- 3 LIVE COIN TICKERS (IFRAME - 100% WORKS) -->
  <div class="crypto-grid">
    <div class="coin-card">
      <div class="coin-title"><span>🟠 BITCOIN</span><span>BTC / USDT</span></div>
      <iframe src="https://tradingview.com" style="width:100%; height:140px; border:none; border-radius:10px;" scrolling="no"></iframe>
    </div>

    <div class="coin-card">
      <div class="coin-title"><span>🔷 ETHEREUM</span><span>ETH / USDT</span></div>
      <iframe src="https://tradingview.com" style="width:100%; height:140px; border:none; border-radius:10px;" scrolling="no"></iframe>
    </div>

    <div class="coin-card">
      <div class="coin-title"><span>🟣 SOLANA</span><span>SOL / USDT</span></div>
      <iframe src="https://tradingview.com" style="width:100%; height:140px; border:none; border-radius:10px;" scrolling="no"></iframe>
    </div>
  </div>

  <!-- STATUS STRIP -->
  <div class="status-strip">
    <div>📊 Data Feed: <b style="color:#22C55E;">🟢 BINANCE LIVE STREAM</b></div>
    <div>🤖 AI Scanner: <b style="color:#22C55E;">🟢 ACTIVE</b></div>
    <div>⏱️ Market: <b style="color:var(--gold-bright);">24/7 GLOBAL CRYPTO</b></div>
  </div>

  <!-- MAIN LIVE CANDLESTICK CHART (Яг таны XAUUSD график шиг) -->
  <div class="chart-wrapper" style="margin-top: 10px;">
    <h2>📈 BITCOIN (BTC/USDT) БОДИТ ЦАГИЙН ГРАФИК</h2>
    <div class="chart-frame">
      <iframe src="https://tradingview.com" allowtransparency="true" scrolling="no"></iframe>
    </div>
  </div>
</div>

</body>
</html>
