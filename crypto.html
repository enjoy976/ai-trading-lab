<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="auth.js"></script>

<script>


// ===============================
// CHECK LOGIN SESSION
// ===============================


async function checkAccess(){


const {data} = await supabaseClient.auth.getSession();



if(!data.session){


window.location.href="login.html";


return false;


}


return true;


}









// ===============================
// LOAD REAL CRYPTO PRICES
// ===============================


async function updateCrypto(){



try{



const response = await fetch(

"https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd&include_24hr_change=true",

{

cache:"no-store"

}

);





if(!response.ok){

throw new Error(

"API ERROR: " + response.status

);

}





const data = await response.json();





// ===============================
// BTC
// ===============================


const btcPrice = data.bitcoin.usd;

const btcChange = data.bitcoin.usd_24h_change;



document.getElementById("btc").innerHTML =

"$ " + btcPrice.toLocaleString(

"en-US",

{

minimumFractionDigits:2,

maximumFractionDigits:2

}

)

+ " "

+ formatChange(btcChange);





// ===============================
// ETH
// ===============================


const ethPrice = data.ethereum.usd;

const ethChange = data.ethereum.usd_24h_change;



document.getElementById("eth").innerHTML =

"$ " + ethPrice.toLocaleString(

"en-US",

{

minimumFractionDigits:2,

maximumFractionDigits:2

}

)

+ " "

+ formatChange(ethChange);





// ===============================
// SOL
// ===============================


const solPrice = data.solana.usd;

const solChange = data.solana.usd_24h_change;



document.getElementById("sol").innerHTML =

"$ " + solPrice.toLocaleString(

"en-US",

{

minimumFractionDigits:2,

maximumFractionDigits:2

}

)

+ " "

+ formatChange(solChange);





// ===============================
// MARKET STATUS
// ===============================


const averageChange =

(

btcChange +

ethChange +

solChange

) / 3;





let marketStatus;



if(averageChange >= 2){

marketStatus = "🟢 Bullish Momentum";

}

else if(averageChange <= -2){

marketStatus = "🔴 Bearish Momentum";

}

else{

marketStatus = "🟡 Market Waiting";

}





document.getElementById("market").innerHTML =

marketStatus;





// ===============================
// UPDATE TIME
// ===============================


const now = new Date();



document.getElementById("updated").innerHTML =

now.toLocaleTimeString("en-US");



}



catch(error){



console.error(error);



document.getElementById("market").innerHTML =

"🔴 DATA CONNECTION ERROR";



document.getElementById("updated").innerHTML =

"API unavailable";



}



}









// ===============================
// 24H CHANGE FORMAT
// ===============================


function formatChange(change){



if(change === null || change === undefined){

return "";

}



if(change > 0){

return "🟢 +" + change.toFixed(2) + "%";

}



if(change < 0){

return "🔴 " + change.toFixed(2) + "%";

}



return "🟡 0.00%";



}









// ===============================
// START
// ===============================


async function startCrypto(){



const loggedIn = await checkAccess();



if(!loggedIn){

return;

}



await updateCrypto();



}






startCrypto();





// Update every 30 seconds
// Public API rate limit хамгаална


setInterval(async function(){



const loggedIn = await checkAccess();



if(loggedIn){

updateCrypto();

}



},30000);



</script>
