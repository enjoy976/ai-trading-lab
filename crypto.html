<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Scanner | STRYX ZONE</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .crypto-wrap { max-width: 1100px; margin: 90px auto 50px; padding: 0 18px; }
    .crypto-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin: 24px 0; }
    .coin-card { background: rgba(16, 20, 29, 0.85); border: 1px solid var(--border-strong); border-radius: 16px; padding: 22px; transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .coin-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15); border-color: var(--gold); }
    .coin-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .coin-name { font-weight: 700; font-size: 16px; color: var(--gold-bright); display: flex; align-items: center; gap: 8px; }
    .coin-tag { font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 6px; background: rgba(212,175,55,0.12); color: var(--gold); }
    .coin-val { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--text); }
    .status-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; background: rgba(16,20,29,0.75); border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px; margin-bottom: 24px; font-family: var(--mono); font-size: 13px; }
    .chart-box { background: rgba(16,20,29,0.85); border: 1px solid var(--border-strong); border-radius: 16px; padding: 16px; margin-bottom: 24px; }
  </style>
</head>
<body>

<div class="header-bar" style="top: 0;">
  <a href="dashboard.html" style="text-decoration:none; color:var(--gold-bright); font-family:var(--mono); font-weight:700; font-size:13px;">← DASHBOARD</a>
  <div style="font-family:var(--mono); color:#22C55E; font-size:12px; font-weight:700;">🟢 CRYPTO ENGINE ONLINE</div>
</div>

<div class="crypto-wrap">
  <div class="terminal-title" style="margin-bottom: 10px;">
    <h1>₿ STRYX CRYPTO TERMINAL</h1>
    <p class="subtitle">BTC • ETH • SOL Real-Time Market Intelligence</p>
  </div>

    <!-- 3 COIN CARDS (TRADINGVIEW 24/7 LIVE) -->
  <div class="crypto-grid">
    <!-- BITCOIN -->
    <div class="coin-card" style="padding: 12px;">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://tradingview.com" async>
        {
          "symbol": "BINANCE:BTCUSDT",
          "width": "100%",
          "isTransparent": true,
          "colorTheme": "dark",
          "locale": "en"
        }
        </script>
      </div>
    </div>

    <!-- ETHEREUM -->
    <div class="coin-card" style="padding: 12px;">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://tradingview.com" async>
        {
          "symbol": "BINANCE:ETHUSDT",
          "width": "100%",
          "isTransparent": true,
          "colorTheme": "dark",
          "locale": "en"
        }
        </script>
      </div>
    </div>

    <!-- SOLANA -->
    <div class="coin-card" style="padding: 12px;">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://tradingview.com" async>
        {
          "symbol": "BINANCE:SOLUSDT",
          "width": "100%",
          "isTransparent": true,
          "colorTheme": "dark",
          "locale": "en"
        }
        </script>
      </div>
    </div>
  </div>

  <!-- STATUS STRIP -->
  <div class="status-strip">
    <div>📊 Data Feed: <b style="color:#22C55E;">🟢 TRADINGVIEW REAL-TIME</b></div>
    <div>🤖 AI Scanner: <b style="color:#22C55E;">🟢 ACTIVE</b></div>
    <div>⏱️ Session: <b style="color:var(--gold-bright);">24/7 GLOBAL CRYPTO</b></div>
  </div>

  <!-- LIVE TRADINGVIEW BTC CHART -->
  <div class="chart-box">
    <div style="font-family:var(--mono); font-size:12px; color:var(--gold); margin-bottom:10px; font-weight:700;">📈 BITCOIN (BTC/USDT) LIVE CHART</div>
    <div class="tradingview-widget-container" style="height:420px;width:100%">
      <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
      <script type="text/javascript" src="https://tradingview.com" async>
      {
        "autosize": true,
        "symbol": "BINANCE:BTCUSDT",
        "interval": "15",
        "timezone": "Asia/Ulaanbaatar",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "allow_symbol_change": true,
        "calendar": false,
        "support_host": "https://tradingview.com"
      }
      </script>
    </div>
  </div>
</div>

</body>
</html>
